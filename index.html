<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Magical Cannabunny</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: #000;
      font-family: Georgia, serif;
    }

    /* INTRO VIDEO */
    #intro {
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: opacity 1.5s ease;
    }

    #intro video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #000;
    }

    /* SKIP INTRO */
    #skipIntro {
      position: absolute;
      right: 24px;
      bottom: 24px;
      padding: 10px 18px;
      border: 1px solid rgba(255,255,255,.7);
      border-radius: 30px;
      background: rgba(0,0,0,.45);
      color: white;
      font-size: 14px;
      cursor: pointer;
      backdrop-filter: blur(5px);
    }

    /* MAIN WEBSITE */
    #website {
      min-height: 100vh;
      background:
        linear-gradient(rgba(12,35,20,.72), rgba(5,18,10,.92)),
        radial-gradient(circle at center, #356b3e, #08150b 70%);
      color: white;
      opacity: 0;
      transition: opacity 1.8s ease;
    }

    .hero {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 40px 20px;
    }

    .hero h1 {
      font-size: clamp(42px, 8vw, 86px);
      margin: 0 0 20px;
      font-weight: normal;
      letter-spacing: 1px;
    }

    .hero p {
      max-width: 760px;
      font-size: clamp(18px, 3vw, 25px);
      line-height: 1.6;
      margin: 0 auto 35px;
    }

    .enter-button {
      display: inline-block;
      padding: 15px 32px;
      border: 1px solid rgba(255,255,255,.7);
      border-radius: 40px;
      color: white;
      text-decoration: none;
      font-size: 18px;
      background: rgba(255,255,255,.08);
      transition: .3s ease;
    }

    .enter-button:hover {
      background: rgba(255,255,255,.2);
      transform: translateY(-2px);
    }
  </style>
</head>

<body>

  <!-- OPENING VIDEO -->
  <div id="intro">
    <video id="introVideo" autoplay muted playsinline>
      <source src="07C49AD3-435F-46FB-945C-C07483F6EA1B.mp4" type="video/mp4">
    </video>

    <button id="skipIntro">Skip Intro</button>
  </div>

  <!-- MAIN WEBSITE -->
  <main id="website">
    <section class="hero">
      <h1>The Magical Cannabunny</h1>

      <p>
        Regenerative agriculture, living soil, compost tea,
        seeds, bunnies, and a little bit of magic.
      </p>

      <a href="#" class="enter-button" onclick="enterWebsite(); return false;">
        Enter the Magical Garden
      </a>
    </section>
  </main>

  <script>
    const intro = document.getElementById("intro");
    const video = document.getElementById("introVideo");
    const website = document.getElementById("website");
    const skip = document.getElementById("skipIntro");

    function enterWebsite() {
      intro.style.opacity = "0";
      website.style.opacity = "1";

      setTimeout(() => {
        intro.style.display = "none";
      }, 1500);
    }

    video.addEventListener("ended", enterWebsite);
    skip.addEventListener("click", () => {
      video.pause();
      enterWebsite();
    });
  </script>

</body>
</html>
